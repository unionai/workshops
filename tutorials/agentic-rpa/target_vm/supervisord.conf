; Desktop session and toy apps for the RPA target. Installed to /etc/supervisor/conf.d/rpa.conf.

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true

[program:xfce]
command=/opt/acme/start-xfce.sh
user=rpa
environment=DISPLAY=":1",HOME="/home/rpa",USER="rpa"
priority=20
startsecs=5
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900 -quiet
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=31
autorestart=true

[program:computer_server]
command=/opt/acme/venv/bin/python -m computer_server --host 0.0.0.0 --port 8000
directory=/home/rpa
user=rpa
environment=DISPLAY=":1",HOME="/home/rpa",USER="rpa"
priority=40
startsecs=5
autorestart=true

[program:erp_api]
command=/opt/acme/venv/bin/uvicorn erp_api:app --host 0.0.0.0 --port 8001
directory=/opt/acme
user=rpa
environment=ACME_DB="/srv/acme/acme.db",HOME="/home/rpa"
priority=50
autorestart=true

[program:supplier_portal]
command=/opt/acme/venv/bin/uvicorn supplier_portal:app --host 0.0.0.0 --port 8002
directory=/opt/acme
user=rpa
environment=ACME_DB="/srv/acme/acme.db",ACME_HOME="/srv/acme",HOME="/home/rpa"
priority=50
autorestart=true

[program:erp_desktop]
command=/opt/acme/venv/bin/python /opt/acme/erp_desktop.py
directory=/opt/acme
user=rpa
environment=DISPLAY=":1",ACME_DB="/srv/acme/acme.db",HOME="/home/rpa"
priority=60
startsecs=3
autorestart=true

[program:drop_watcher]
command=/opt/acme/venv/bin/python /opt/acme/drop_watcher.py
directory=/opt/acme
user=rpa
environment=ACME_DROP="/srv/drop",HOME="/home/rpa"
priority=70
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/acme/hooks.log
