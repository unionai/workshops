[project]
name = "bionemo-playground"
version = "0.1.0"
description = "NVIDIA BioNeMo generative virtual screening blueprint, self-hosted on Union with Flyte 2"
requires-python = ">=3.12"
dependencies = [
    "flyte==2.12.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rdkit>=2024.3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
